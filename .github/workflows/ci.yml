name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a ref cancels that ref's older run, on main too: the newer commit contains the
# older one, and its run tests and deploys it. The deploy job keeps a group of its own.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      # Runner speed varies about 2x between runs, so every job logs the CPU it drew.
      - name: Log the runner's CPU
        run: |
          echo "$(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  checks:
    name: App checks (lint, Vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    outputs:
      dist-sha256: ${{ steps.dist.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: Log the runner's CPU
        run: |
          echo "$(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Vitest compares against the fixture build, made here from this commit's pipeline so no
      # test depends on a hash computed on another machine (streaming.md 7.3).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
        working-directory: pipeline
      - run: npm run fixture
      - run: npm run lint
      - run: npm test
      # The typecheck, and the build the deploy job ships once every e2e shard has tested it.
      - run: npm run build
      - name: Record the build's sha256
        id: dist
        run: |
          sha=$(../.github/scripts/dist-sha256.sh dist)
          echo "dist sha256 $sha"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      - name: Keep the build for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: app-dist
          path: app/dist
          include-hidden-files: true
          retention-days: 7

  # The browser tests, as parallel jobs: the shards app/e2e/shards.ts names, one runner and one
  # worker each. Each one's npm run e2e builds its own dist, whose sha256 it records for the Tested
  # build job.
  e2e:
    name: E2E (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every shard app/e2e/shards.ts names; 'rest' takes every spec the others do not name.
        # app/scripts/ciShards.test.ts holds this list, the outputs and Tested build's to it.
        shard: [magellan, lobby, explore, ruler, touch, borders, rest]
    defaults:
      run:
        working-directory: app
    # One output per shard, since matrix jobs share one set of outputs.
    outputs:
      magellan: ${{ steps.dist.outputs.magellan }}
      lobby: ${{ steps.dist.outputs.lobby }}
      explore: ${{ steps.dist.outputs.explore }}
      ruler: ${{ steps.dist.outputs.ruler }}
      touch: ${{ steps.dist.outputs.touch }}
      borders: ${{ steps.dist.outputs.borders }}
      rest: ${{ steps.dist.outputs.rest }}
    steps:
      - uses: actions/checkout@v7
      - name: Log the runner's CPU
        run: |
          echo "$(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # The tests read the fixture through its data server, built here as in the checks job.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
        working-directory: pipeline
      - run: npm run fixture
      # The browser alone: the runner's image already holds every library the headless shell
      # links, and --with-deps added only fallback fonts no test reads and a Mesa SwiftShader never
      # uses, through apt downloads that took up to 11 of the job's 15 minutes when the mirror
      # was slow. A library the image lacks fails the first launch, which names it.
      - run: npx playwright install --only-shell chromium
      # npm run e2e builds app/dist with vite build, then runs this shard's specs against it.
      - run: npm run e2e
        env:
          WANDER_E2E_SHARD: ${{ matrix.shard }}
      - name: Record the tested build's sha256
        id: dist
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          sha=$(../.github/scripts/dist-sha256.sh dist)
          echo "dist sha256 $sha"
          echo "$SHARD=$sha" >> "$GITHUB_OUTPUT"
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            app/playwright-report
            app/test-results
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release data is live
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Log the runner's CPU
        run: |
          echo "$(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.nvmrc
      # The bundled release's data must be live on R2 before the page that names it can merge or
      # deploy (streaming.md 4.3); it fails, naming npm run publish-data, until the upload is done.
      # Plain Node with a type import only, so it needs no npm ci.
      - run: npm run check-release

  # The deploy ships the checks job's build, so every shard must have tested that build byte for
  # byte. This runs on every event, so a pull request proves the check before main relies on it.
  tested-build:
    name: Tested build
    needs: [checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log the runner's CPU
        run: |
          echo "$(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
      - name: Check that every e2e shard tested the checks job's build
        env:
          CHECKS: ${{ needs.checks.outputs.dist-sha256 }}
          TESTED: ${{ toJSON(needs.e2e.outputs) }}
          # Every shard in the e2e matrix.
          SHARDS: magellan lobby explore ruler touch borders rest
        run: |
          echo "the checks job built dist sha256 $CHECKS"
          test -n "$CHECKS" || { echo "The checks job recorded no dist sha256."; exit 1; }
          for shard in $SHARDS; do
            tested=$(jq -r --arg shard "$shard" '.[$shard] // ""' <<<"$TESTED")
            test "$tested" = "$CHECKS" || { echo "The $shard shard tested dist '$tested', not $CHECKS."; exit 1; }
          done

  deploy:
    name: Deploy to Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [pipeline, checks, e2e, tested-build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    steps:
      - name: Require the deploy token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$TOKEN" || { echo "The CLOUDFLARE_API_TOKEN repository secret is not set."; exit 1; }
      - uses: actions/checkout@v7
      - name: Log the runner's CPU
        run: |
          echo "$(nproc) CPUs, $(lscpu | sed -n 's/^Model name: *//p')"
      - uses: actions/download-artifact@v8
        with:
          name: app-dist
          path: app/dist
      # The Tested build job found every shard tested the checks job's build; this must be it.
      - name: Check that this is the build every e2e shard tested
        env:
          CHECKS: ${{ needs.checks.outputs.dist-sha256 }}
        run: |
          deployed=$(.github/scripts/dist-sha256.sh app/dist)
          echo "deploying dist sha256 $deployed"
          test "$CHECKS" = "$deployed" || { echo "app-dist is $deployed, not the checks job's $CHECKS."; exit 1; }
      - name: Deploy
        id: deploy
        # Pinned by commit: this action receives the deploy token.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account IDs are identifiers, not credentials.
          accountId: 5cd6b468f9f946f44222ad8a966999ca
          wranglerVersion: "4.139.0"
          command: pages deploy app/dist --project-name=wander --branch=main
      - name: Check the deployment serves the app, its credits and real 404s
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          curl -fsS "$DEPLOYMENT_URL/" | grep -q '<title>Wander</title>'
          status=$(curl -s -o /dev/null -w '%{http_code}' "$DEPLOYMENT_URL/credits")
          test "$status" = 200 || { echo "/credits returned $status, not 200"; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' "$DEPLOYMENT_URL/no-such-page")
          test "$status" = 404 || { echo "missing path returned $status, not 404"; exit 1; }
