# The events Explore opens on (docs/design/streaming.md 3.4): each an event of the index, with the
# line its plate pins on landing, in the walk's voice, and the source that line rests on. `date`
# gives the day a source dates the event to where the index holds only its month or year, or
# another day, as an ISO day in the proleptic Gregorian calendar the index uses. A line never
# names a day and month other than the event's date as its sources give it (Julian before
# 15 October 1582). `uv run prebuild openings` checks the list against the event index and writes
# openings.lock.json beside it, which the app bundles and event-files forces into the overview.

Q203729:
  line: At Kadesh, Ramesses II's Egyptians meet Muwatalli II's Hittites with thousands of chariots
  source: {title: Battle of Kadesh (Wikipedia), url: "https://en.wikipedia.org/wiki/Battle_of_Kadesh"}

