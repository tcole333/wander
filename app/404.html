<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found · Wander</title>
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/page/static.css" />
  </head>
  <!-- Pages serves this, with a 404, for any path the build does not hold (streaming.md 4.2): the
       museum's room with the mark, and a vellum card pointing back to the globe. -->
  <body class="room-page">
    <div class="room">
      <div class="room-mark">
        <div class="wu-mark-word">WANDER</div>
        <div class="wu-mark-rule"><span></span><i>✦</i><span></span></div>
        <div class="wu-mark-sub">AN INTERACTIVE HISTORY</div>
      </div>
      <main class="plate plate-card wu-card wu-lit">
        <div class="wu-sheet">
          <header class="wu-card-head">
            <h1 class="wu-title">Not found</h1>
            <div class="wu-rule"></div>
          </header>
          <p class="plate-blurb">No page stands at this address.</p>
          <footer class="plate-foot">
            <a class="plate-button plate-link" href="/">Return to the globe</a>
          </footer>
        </div>
      </main>
    </div>
  </body>
</html>
