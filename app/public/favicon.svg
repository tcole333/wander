<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Wander's icon: the lacquered globe with its engraved graticule, in its brass meridian ring
       and a tilted armillary ring passing behind it, lit from the upper left, and the ember of the
       active event. -->
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e0aa" />
      <stop offset="0.35" stop-color="#c09652" />
      <stop offset="0.75" stop-color="#7d5d2c" />
      <stop offset="1" stop-color="#3e2c13" />
    </linearGradient>
    <radialGradient id="lacquer" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#34463f" />
      <stop offset="0.55" stop-color="#111b1b" />
      <stop offset="1" stop-color="#040606" />
    </radialGradient>
    <radialGradient id="ember">
      <stop offset="0" stop-color="#ffe0b8" />
      <stop offset="0.4" stop-color="#e8662c" />
      <stop offset="1" stop-color="#e8662c" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15.2" fill="#0b0806" />
  <g transform="rotate(-24 16 16)" fill="none">
    <path d="M2.6 16A13.4 4.4 0 0 1 29.4 16" stroke="#6f5027" stroke-width="1.5" />
  </g>
  <circle cx="16" cy="16" r="10.6" fill="url(#lacquer)" />
  <g fill="none" stroke="#c09652" stroke-opacity="0.5" stroke-width="0.6">
    <ellipse cx="16" cy="16" rx="4.6" ry="10.6" />
    <path d="M5.4 16h21.2" />
  </g>
  <circle cx="19.4" cy="18.4" r="2.8" fill="url(#ember)" />
  <circle cx="16" cy="16" r="13" fill="none" stroke="url(#brass)" stroke-width="2.6" />
  <g transform="rotate(-24 16 16)" fill="none">
    <path d="M2.6 16A13.4 4.4 0 0 0 29.4 16" stroke="url(#brass)" stroke-width="1.6" />
  </g>
</svg>
