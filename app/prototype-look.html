<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Surface look harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #050403;
        overflow: hidden;
        font:
          12px/1.4 ui-monospace,
          monospace;
        color: #c9a86a;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 12px;

        align-items: center;
      }
      #hud button {
        font: inherit;
        color: inherit;
        background: #1a130b;
        border: 1px solid #5a4424;
        padding: 3px 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Dev-only: served by the Vite dev server for the look prototype, never built. -->
    <div id="stage"></div>
    <div id="hud">
      <span id="views"></span>
      <span id="status">loading…</span>
    </div>
    <script type="module" src="/src/prototype/look/lookPage.main.ts"></script>
  </body>
