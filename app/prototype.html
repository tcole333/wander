<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wander look prototype</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050403;
      }
      #hud {
        position: fixed;
        left: 16px;
        top: 14px;
        margin: 0;
        font:
          11px/1.5 ui-monospace,
          Menlo,
          monospace;
        color: rgb(232 220 197 / 0.7);
        white-space: pre;
        pointer-events: none;
      }
      #presets {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        gap: 2px;
        padding: 4px;
        border: 1px solid rgb(202 164 94 / 0.45);
        background: rgb(12 9 6 / 0.72);
      }
      #presets button {
        font:
          11px/1 Georgia,
          serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #d9c49a;
        background: none;
        border: 0;
        padding: 8px 10px;
        cursor: pointer;
      }
      #presets button:hover {
        background: rgb(202 164 94 / 0.18);
      }
      #note {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        font:
          12px Georgia,
          serif;
        color: #1b140b;
        background: #d9c49a;
      }
      #settings {
        position: fixed;
        inset: 10% 25%;
        font:
          11px/1.4 ui-monospace,
          Menlo,
          monospace;
      }
      body.clean #hud,
      body.clean #presets,
      body.story #hud {
        display: none;
      }
      /* The panel, closed, sits left of Meanwhile. */
      body.story .lil-gui.autoPlace {
        right: 344px;
      }
      /* The panel's gear (src/prototype/app/panel.ts), which a story tucks the panel behind: small
         engraved brass at the top right corner. */
      .wu-gear {
        position: fixed;
        z-index: 11;
        top: 5px;
        right: 6px;
        width: 17px;
        height: 17px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
        color: #b08a4a;
        opacity: 0.45;
        filter: drop-shadow(0.5px 1px 0.5px rgb(0 0 0 / 0.9));
        transition:
          opacity 0.2s,
          filter 0.2s;
      }
      .wu-gear svg {
        display: block;
        width: 100%;
        height: 100%;
        fill: currentColor;
        stroke: #3d2a12;
        stroke-width: 0.6;
      }
      .wu-gear:hover,
      .wu-gear[aria-expanded='true'] {
        opacity: 1;
        filter: drop-shadow(0.5px 1px 0.5px rgb(0 0 0 / 0.9))
          drop-shadow(0 0 4px rgb(255 190 110 / 0.55));
      }
      .wu-gear:focus-visible {
        outline: 1px solid #e3c486;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <!-- Dev-only: the look prototype (issue #4), served by the Vite dev server and never built.
         ?data=fixture|region|global|<origin>, ?view=<preset>, ?ui=0, ?story=tambora, and any module
         param by name. -->
    <pre id="hud">loading…</pre>
    <div id="presets"></div>
    <div id="note" hidden></div>
    <script type="module" src="/src/prototype/app/main.ts"></script>
  </body>
</html>
