<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wander look prototype</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050403;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        touch-action: none;
      }
      #hud {
        position: fixed;
        left: 16px;
        bottom: 14px;
        margin: 0;
        font:
          11px/1.5 ui-monospace,
          Menlo,
          monospace;
        color: rgb(232 220 197 / 0.7);
        white-space: pre;
        pointer-events: none;
      }
      #presets {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        gap: 2px;
        padding: 4px;
        border: 1px solid rgb(202 164 94 / 0.45);
        background: rgb(12 9 6 / 0.72);
      }
      #presets button {
        font:
          11px/1 Georgia,
          serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #d9c49a;
        background: none;
        border: 0;
        padding: 8px 10px;
        cursor: pointer;
      }
      #presets button:hover {
        background: rgb(202 164 94 / 0.18);
      }
      #note {
        position: fixed;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        font:
          12px Georgia,
          serif;
        color: #1b140b;
        background: #d9c49a;
      }
      #settings {
        position: fixed;
        inset: 10% 25%;
        font:
          11px/1.4 ui-monospace,
          Menlo,
          monospace;
      }
      body.clean #hud,
      body.clean #presets {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Dev-only: the look prototype (issue #4), served by the Vite dev server and never built.
         ?data=region|global, ?view=<preset>, ?ui=0, and any module param by name. -->
    <pre id="hud">loading…</pre>
    <div id="presets"></div>
    <div id="note" hidden></div>
    <script type="module" src="/src/prototype/app/main.ts"></script>
  </body>
</html>
