<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walk effects harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050403;
      }
      canvas {
        position: fixed;
        inset: 0;
        display: block;
        touch-action: none;
      }
      #labels {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      #bar {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: min(1100px, calc(100vw - 32px));
        padding: 8px 10px;
        border: 1px solid rgb(202 164 94 / 0.45);
        background: rgb(12 9 6 / 0.78);
        font:
          11px/1.3 Georgia,
          serif;
        color: #d9c49a;
      }
      #beats {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
      }
      #beats button,
      #time button {
        font: inherit;
        letter-spacing: 0.06em;
        color: inherit;
        background: none;
        border: 1px solid transparent;
        padding: 5px 8px;
        cursor: pointer;
      }
      #beats button[aria-pressed='true'] {
        border-color: rgb(202 164 94 / 0.7);
        background: rgb(202 164 94 / 0.16);
      }
      #time {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #time input[type='range'] {
        flex: 1;
        accent-color: #702735;
      }
      #date {
        min-width: 130px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      body.clean #bar,
      body.clean .lil-gui {
        display: none;
      }
    </style>
  </head>
  <body>
    <!-- Dev-only: the walk's story effects (issue #4, checkpoint 2), served by the Vite dev server
         and never built. ?beat=<index>&day=<yyyy-mm-dd>, ?data=region|global, ?ui=0 for shots,
         and any effect or look param by name. -->
    <div id="labels"></div>
    <div id="bar">
      <div id="beats"></div>
      <div id="time">
        <button id="back" title="A day earlier">&minus; day</button>
        <input id="day" type="range" step="0.25" aria-label="Story day" />
        <button id="forward" title="A day later">+ day</button>
        <span id="date"></span>
      </div>
    </div>
    <script type="module" src="/src/prototype/story/effects/harnessPage.ts"></script>
  </body>
</html>
