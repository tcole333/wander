# The raw inputs the prebuild reads (streaming.md 7.1, owner decisions 10 and 11), keyed by the
# ids of the raw-data folder's manifest.json and using its field names. Paths are relative to
# $WANDER_DATA. `uv run prebuild fetch` downloads a missing file from its source_url (a file
# without one is verify-only: checked, never downloaded), unzips each `unzipped` member beside its
# zip, and checks every sha256. Other stages check only byte sizes.
#
# This holds the surface core's inputs (issue #3); each later issue pins the inputs its stages read.

[gebco-2026]
name = "GEBCO_2026 Grid, 15 arc-second global land and sea-floor elevation (ice surface), NetCDF"
version = "GEBCO_2026"
license = "Public domain (GEBCO terms of use; acknowledgement required; not for navigation)"
license_url = "https://www.gebco.net/data-products/gridded-bathymetry-data"
# The citation GEBCO's documentation gives (GEBCO_Grid_docmentation.pdf, p. 4).
attribution = "GEBCO Compilation Group (2026) GEBCO 2026 Grid (doi: 10.5285/4f68d5c7-45eb-f999-e063-7086abc036fa)"
landing_page = "https://www.gebco.net/data-products-gridded-bathymetry-data/gebco2026-grid"
retrieved = "2026-09-24"

