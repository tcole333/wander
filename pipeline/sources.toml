attribution = "Bereiter et al. (2015), Revision of the EPICA Dome C CO2 record from 800 to 600 kyr before present, Geophysical Research Letters 42:542-549, DOI 10.1002/2014GL061957; data: NOAA/WDS Paleoclimatology, Antarctic Ice Cores Revised 800KYr CO2 Data, DOI 10.25921/n8y4-bp27, https://www.ncei.noaa.gov/access/paleo-search/study/17975, accessed 2026-09-29."
landing_page = "https://www.ncei.noaa.gov/access/paleo-search/study/17975"
