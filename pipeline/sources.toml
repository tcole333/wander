# Bereiter et al.'s Antarctic ice-core CO2 composite of the last 800,000 years, for the
# instrument's CO2 ring (issue #85) before Law Dome's record begins. The NOAA template file, a
# `#` header and then tab-separated age_gas_calBP (years before 1950), co2_ppm and co2_1s_ppm:
# 1,901 rows from -51 to 805,669 yr BP. The composite takes Law Dome to 2 kyr BP (Rubino et al.
# 2013 to 1.8 kyr, which law-dome-co2-2019 revises), Dome C from 2 to 11 kyr BP (Monnin et al.
# 2001, 2004) and WAIS, less 4 ppm, from 11 to 22 kyr BP; ages are on AICC2012 except for Law Dome,
# WAIS and Siple Dome. antarctica2015co2composite.txt beside it on NCEI holds the same rows in the
# archive's older format. The study's metadata (its JSON and ISO records, which the landing page
# renders) states no license: its use constraint asks that the publication, the landing page, the
# dataset and publication DOIs and the date accessed be cited.
[antarctic-co2-composite-2015]
name = "Antarctic ice cores revised 800,000-year CO2 composite (Bereiter et al. 2015), NOAA/WDS Paleoclimatology"
version = "NOAA/WDS Paleo study 17975, template file last modified 2024-08-16"
license = "No license stated (NOAA/WDS Paleoclimatology's use constraint: cite the publication, landing page, DOIs and date accessed)"
