# NOAA GML's Mauna Loa CO2 in ppm, for the CO2 ring from 1958: co2_mm_mlo.txt holds monthly means
# from March 1958 (year, month, decimal date, average, deseasonalized, days, stdev and uncertainty
# of the mean, with interpolated months marked by negative days, stdev and uncertainty) and
# co2_annmean_mlo.txt annual means from 1959 (year, mean, unc), each after a `#` header. Scripps
# (C. David Keeling) measured March 1958 to April 1974; from December 2022 to July 2023 the values
# come from Maunakea, after Mauna Loa's eruption. GML rewrites both files early each month (the
# header's File Creation line) and may revise the latest year, so this pins the files it created on
# 2026-09-05, through August 2026: once GML writes the next, a download fails its sha256, and
# renewing the pin means new bytes, sha256, version and retrieved. The files carry GML's data use
# statement, which makes the data freely available and asks for fair credit, and no license. The
# attribution is the reference GML's data page asks for, which credits Scripps.
[noaa-gml-mauna-loa-co2]
name = "Mauna Loa monthly and annual mean CO2 (NOAA GML and Scripps Institution of Oceanography)"
version = "files created 2026-09-05: monthly through August 2026, annual through 2025"
license = "No license stated (NOAA GML's data use statement: freely available, with credit to GML and Scripps)"
license_url = "https://gml.noaa.gov/ccgg/trends/data.html"
attribution = "Dr. Xin Lan, NOAA/GML (gml.noaa.gov/ccgg/trends/) and Dr. Ralph Keeling, Scripps Institution of Oceanography (scrippsco2.ucsd.edu/)."
landing_page = "https://gml.noaa.gov/ccgg/trends/data.html"
retrieved = "2026-09-29"

