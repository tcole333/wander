[project]
name = "wander-prebuild"
version = "0.0.0"
description = "Offline prebuild that turns Wander's raw sources into web assets"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
prebuild = "prebuild.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "prebuild"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]
