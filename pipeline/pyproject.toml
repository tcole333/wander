[project]
name = "wander-prebuild"
version = "0.0.0"
description = "Offline prebuild that turns Wander's raw sources into web assets"
requires-python = ">=3.14"
dependencies = [
    "netcdf4==1.7.4",
    "numpy==2.5.3",
    "pyogrio==0.13.0",
    "pyyaml==6.0.3",
    "shapely==2.1.2",
]

[project.scripts]
prebuild = "prebuild.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Every lock must resolve wheels for the owner's Mac and for CI.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.build-backend]
module-name = "prebuild"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]
