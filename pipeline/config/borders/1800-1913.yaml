# Corrections to Cliopatria for the borders, each in the file of the era it starts in, here from
# 1800 to 1913 (streaming.md 3.3). A step shows the state of 1 January of its year, so a correction
# covers the years whose 1 January falls in its dates.
modified: 2026-09-30
corrections:
  # The Dutch East Indies and the British interregnum.
  - years: [1800, 1802]
    overlap:
      polities: [Batavian Republic, Dutch East Indies]
      winner: Dutch East Indies
    why: >-
      Smaller wins, checked: the Batavian Republic's row repeats the Indies it took over when the
      Dutch East India Company was dissolved in 1800, and the Indies' own row keeps them.
    source:
      title: Dutch East Indies
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Dutch_East_Indies
  - years: [1812, 1816]
    give:
      polity: Dutch East Indies
      to: British Colonial Empire
    why: >-
      The British took Java in 1811 (the Dutch surrendered on 18 September), Raffles governing it as
      lieutenant-governor, and returned Java and the other East Indian possessions to the Dutch in
      1816. Cliopatria's British rows end in 1813, and in 1812-1813 its smaller Dutch row outdraws
      them.
    source:
      title: Invasion of Java (1811)
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Invasion_of_Java_(1811)
  - years: [1800, 1811]
    member:
      polity: Sultan of Yogyakarta
      of: Dutch East Indies
    why: >-
      A dependent by treaty: Yogyakarta, made by the VOC's Treaty of Giyanti (1755), was a
      protectorate of the Batavian Republic within the Dutch East Indies from 1800 to 1806, when
      the VOC's possessions had passed to the Republic, and of the Netherlands from 1806 to 1811.
    source:
      title: Yogyakarta Sultanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Yogyakarta_Sultanate
  - years: [1800, 1811]
    member:
      polity: Surakarta Sunanate
      of: Dutch East Indies
    why: >-
      A dependent by treaty: Surakarta, made by the VOC's Treaty of Giyanti (1755), was a
      protectorate of the Batavian Republic within the Dutch East Indies from 1800 to 1806, when
      the VOC's possessions had passed to the Republic, and of the Netherlands from 1806 to 1811.
    source:
      title: Surakarta Sunanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Surakarta_Sunanate
  - years: [1812, 1816]
    member:
      polity: Sultan of Yogyakarta
      of: British Colonial Empire
    why: A protectorate of the British East India Company from 1811 to 1816.
    source:
      title: Yogyakarta Sultanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Yogyakarta_Sultanate
  - years: [1812, 1816]
    member:
      polity: Surakarta Sunanate
      of: British Colonial Empire
    why: A protectorate of the British East India Company from 1811 to 1816.
    source:
      title: Surakarta Sunanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Surakarta_Sunanate
  - years: [1817, 1829]
    member:
      polity: Sultan of Yogyakarta
      of: Dutch East Indies
    why: >-
      A protectorate of the Netherlands within the Dutch East Indies from 1816 to 1942; Cliopatria's
      Yogyakarta rows end in 1829.
    source:
      title: Yogyakarta Sultanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Yogyakarta_Sultanate
  - years: [1817, 1829]
    member:
      polity: Surakarta Sunanate
      of: Dutch East Indies
    why: >-
      A protectorate of the Netherlands within the Dutch East Indies from 1816 to 1942; Cliopatria's
      Surakarta rows end in 1829.
    source:
      title: Surakarta Sunanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Surakarta_Sunanate
  # Sumbawa's six states in 1815 (owner decision 37), their shapes traced from Chambert-Loir's map
  # as each shape file records.
  - years: [1815, 1815]
    add:
      polity: Kingdom of Tambora
      shape: sumbawa-1815-tambora.geojson
      wikidata: Q20426555
    why: >-
      One of Sumbawa's six states in 1815, on the north-west of the Sanggar peninsula round the
      volcano; the eruption left its land empty until it was annexed to Sanggar in 1866. Shape from
      Chambert-Loir's map in de Jong Boers (1995).
    source:
      title: "Held's History of Sumbawa: An Annotated Translation (Hans Hägerdal), ch. 5, In the Wake of the Tambora Disaster"
      publisher: Amsterdam University Press, 2017 (Cambridge Core)
      url: https://www.cambridge.org/core/product/identifier/9789048531271%23C5/type/BOOK_PART
      locator: p. 141
  - years: [1815, 1815]
    add:
      polity: Kingdom of Pekat
      shape: sumbawa-1815-pekat.geojson
      wikidata: Q20426554
    why: >-
      One of Sumbawa's six states in 1815, on the south of the Sanggar peninsula; after the eruption
      its land was annexed to Dompu in 1866. Shape from Chambert-Loir's map in de Jong Boers (1995).
    source:
      title: "Held's History of Sumbawa: An Annotated Translation (Hans Hägerdal), ch. 5, In the Wake of the Tambora Disaster"
      publisher: Amsterdam University Press, 2017 (Cambridge Core)
      url: https://www.cambridge.org/core/product/identifier/9789048531271%23C5/type/BOOK_PART
      locator: p. 141
  - years: [1815, 1816]
    add:
      polity: Kingdom of Sanggar
      shape: sumbawa-1815-sanggar.geojson
      wikidata: Q20427303
    why: >-
      One of Sumbawa's six states in 1815, on the north-east of the Sanggar peninsula; it outlived
      the eruption as a petty kingdom until it was annexed to Bima in 1928. Shape from
      Chambert-Loir's map in de Jong Boers (1995).
    source:
      title: "Held's History of Sumbawa: An Annotated Translation (Hans Hägerdal), ch. 5, In the Wake of the Tambora Disaster"
      publisher: Amsterdam University Press, 2017 (Cambridge Core)
      url: https://www.cambridge.org/core/product/identifier/9789048531271%23C5/type/BOOK_PART
      locator: p. 141
  - years: [1815, 1816]
    add:
      polity: Sultanate of Dompu
      shape: sumbawa-1815-dompu.geojson
    why: >-
      One of Sumbawa's six states, between Bima and the Sanggar peninsula, bound to the VOC by
      contract since 1669. Shape from Chambert-Loir's map in de Jong Boers (1995).
    source:
      title: "Held's History of Sumbawa: An Annotated Translation (Hans Hägerdal), ch. 3, The Sumbawan Kingdoms under VOC Suzerainty (1)"
      publisher: Amsterdam University Press, 2017 (Cambridge Core)
      url: https://www.cambridge.org/core/product/identifier/9789048531271%23C3/type/BOOK_PART
      locator: p. 77
  - years: [1815, 1816]
    add:
      polity: Sultanate of Sumbawa
      shape: sumbawa-1815-sumbawa.geojson
      wikidata: Q20427322
    why: >-
      The western half of the island, bordering Dompu on the isthmus south of Saleh Bay. Shape from
      Chambert-Loir's map in de Jong Boers (1995).
    source:
      title: "Held's History of Sumbawa: An Annotated Translation (Hans Hägerdal), ch. 4, The Sumbawan Kingdoms under VOC Suzerainty (2)"
      publisher: Amsterdam University Press, 2017 (Cambridge Core)
      url: https://www.cambridge.org/core/product/identifier/9789048531271%23C4/type/BOOK_PART
      locator: p. 115
  - years: [1815, 1816]
    add:
      polity: Sultanate of Bima
      shape: sumbawa-1815-bima.geojson
    why: >-
      Bima's land on Sumbawa east of Dompu, joined to Cliopatria's Bima row, which holds its lands
      across the strait. Shape from Chambert-Loir's map in de Jong Boers (1995).
    source:
      title: "Held's History of Sumbawa: An Annotated Translation (Hans Hägerdal), ch. 3, The Sumbawan Kingdoms under VOC Suzerainty (1)"
      publisher: Amsterdam University Press, 2017 (Cambridge Core)
      url: https://www.cambridge.org/core/product/identifier/9789048531271%23C3/type/BOOK_PART
      locator: p. 77
  - years: [1815, 1815]
    member:
      polity: Kingdom of Tambora
      of: British Colonial Empire
    why: &sumbawa-members >-
      The Sumbawan states, bound by contract to the Dutch, were under the British with the rest of
      the Dutch posts in 1815-1816: Bima had a Resident, and Raffles's government sent Lieutenant
      Owen Phillips to inspect the eruption's damage and help the islanders. The rulers renewed
      their contracts with the Dutch governor at Makassar in 1817.
    source: &dejongboers
      title: "Mount Tambora in 1815: A Volcanic Eruption in Indonesia and its Aftermath (Bernice de Jong Boers)"
      publisher: Indonesia 60 (1995), Cornell University Southeast Asia Program
      url: https://ecommons.cornell.edu/entities/publication/e0fab329-c363-471f-8923-6aba7eccf14b
      locator: pp. 41, 46
  - years: [1815, 1815]
    member:
      polity: Kingdom of Pekat
      of: British Colonial Empire
    why: *sumbawa-members
    source: *dejongboers
  - years: [1815, 1816]
    member:
      polity: Kingdom of Sanggar
      of: British Colonial Empire
    why: *sumbawa-members
    source: *dejongboers
  - years: [1815, 1816]
    member:
      polity: Sultanate of Dompu
      of: British Colonial Empire
    why: *sumbawa-members
    source: *dejongboers
  - years: [1815, 1816]
    member:
      polity: Sultanate of Sumbawa
      of: British Colonial Empire
    why: *sumbawa-members
    source: *dejongboers
  - years: [1815, 1816]
    member:
      polity: Sultanate of Bima
      of: British Colonial Empire
    why: *sumbawa-members
    source: *dejongboers
  # India: Mysore, Hyderabad and the Mughal emperor.
  - years: [1800, 1947]
    add:
      polity: Kingdom of Mysore
      shape: mysore-1799.geojson
    why: >-
      Cliopatria's Mysore ends with Tipu's kingdom in 1799. The Wodeyars' reduced state is drawn
      from 1800 in its shape on the Imperial Gazetteer's 1909 map (native states coloured yellow),
      traced and georeferenced on the plate's graticule; its bounds match the Gazetteer's own
      figures to 0.03°.
    source:
      title: Madras (Southern Section) with Mysore, Coorg & Travancore, Imperial Gazetteer of India (J. G. Bartholomew, 1909)
      publisher: Wikimedia Commons
      url: https://commons.wikimedia.org/wiki/File:Madras_Prov_South_1909.jpg
  - years: [1800, 1858]
    member:
      polity: Kingdom of Mysore
      of: British Empire
    why: >-
      A princely state by treaty: after Tipu's death in 1799 the restored Wodeyars ruled under a
      subsidiary alliance with a British Resident, until Mysore joined India in August 1947.
    source:
      title: Kingdom of Mysore
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Kingdom_of_Mysore
  - years: [1859, 1947]
    member:
      polity: Kingdom of Mysore
      of: British Raj
    why: >-
      A princely state under British paramountcy, directly administered from 1831 to 1881, until
      Mysore joined India on 9 August 1947.
    source:
      title: Kingdom of Mysore
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Kingdom_of_Mysore
  - years: [1801, 1946]
    add:
      polity: Hyderabad State
      shape: hyderabad-1800.geojson
    why: >-
      In 1800 the Nizam ceded to the Company the districts he had gained from Mysore, to pay for its
      subsidiary force; the dominions left to him are Cliopatria's own Hyderabad of 1947, which it
      otherwise draws as British. Berar, the Nizam's from 1803 until assigned in 1853, is left for
      review.
    source:
      title: Ceded Districts
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Ceded_Districts
  - years: [1801, 1858]
    member:
      polity: Hyderabad State
      of: British Empire
    why: >-
      A dependent by treaty: the 1798 agreement put Hyderabad under British protection, and the
      Nizam remained a subsidiary ally under British paramountcy.
    source:
      title: Hyderabad State
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Hyderabad_State
  - years: [1859, 1947]
    member:
      polity: Hyderabad State
      of: British Raj
    why: >-
      A princely state under British paramountcy, with a 23-gun salute, until Indian independence;
      Cliopatria's own Hyderabad row begins in 1947.
    source:
      title: Hyderabad State
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Hyderabad_State
  - years: [1804, 1857]
    member:
      polity: Mughal Empire
      of: British Empire
    why: >-
      On 14 September 1803 British troops entered Delhi and took Shah Alam II under their
      protection; he and his successors ruled only Delhi as the Company's pensioners until the
      revolt of 1857.
    source:
      title: Shah Alam II
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Shah_Alam_II
  - years: [1858, 1858]
    give:
      polity: Mughal Empire
      to: British Empire
    why: >-
      The British retook Delhi in September 1857 and captured Bahadur Shah II at Humayun's Tomb on
      20 September; tried at the Red Fort and exiled to Rangoon, he was the last of his dynasty.
      Cliopatria keeps his Delhi row into 1858.
    source:
      title: Bahadur Shah Zafar
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Bahadur_Shah_Zafar
  # The Cape, Persia, Arabia, Central Asia and Mexico.
  - years: [1803, 1803]
    overlap:
      polities: [British Cape Colony, Napoleonic Batavia Republic]
      winner: British Cape Colony
    why: >-
      Britain handed the Cape back to the Batavian Republic only on 1 March 1803, so on 1 January it
      was still British.
    source: &cape
      title: Dutch Cape Colony
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Dutch_Cape_Colony
  - years: [1804, 1806]
    overlap:
      polities: [British Cape Colony, Napoleonic Batavia Republic]
      winner: Napoleonic Batavia Republic
    why: >-
      Smaller wins, checked: the Batavian Republic held the Cape from March 1803 until the British
      took it in January 1806.
    source: *cape
  - years: [1804, 1806]
    member:
      polity: Napoleonic Batavia Republic
      of: (Batavian Republic)
    why: >-
      The Batavian Republic's colony at the Cape, so it shares the Republic's outer border.
    source: *cape
  - years: [1807, 1867]
    give:
      polity: Napoleonic Batavia Republic
      to: British Cape Colony
    why: >-
      The British occupied the Cape again in January 1806 after Blaauwberg, and the Anglo-Dutch
      Treaty of 1814 confirmed it British; Cliopatria keeps a Batavian row to 1867.
    source: *cape
  - years: [1895, 1897]
    give:
      polity: Qajar Dynasty
      to: Dutch East Indies
      shape_from: {polity: Dutch East Indies, year: 1898}
    why: >-
      Cliopatria's rows for 1895–1897 swap two names: its Qajar Dynasty row holds the Indies and its
      Dutch East Indies row holds Persia. This gives the Indies back to the colony that held them;
      the next correction gives Persia back.
    source:
      title: Dutch East Indies
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Dutch_East_Indies
  - years: [1895, 1897]
    give:
      polity: Dutch East Indies
      to: Qajar Dynasty
      shape_from: {polity: Qajar Dynasty, year: 1898}
    why: >-
      Persia under the Qajars (1789–1925), drawn in 1895–1897 under the Dutch East Indies' name,
      returns to the Qajar Dynasty.
    source:
      title: Qajar Iran
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Qajar_Iran
  - years: [1842, 1845]
    overlap:
      polities: [Emirate of Jabal Shammar, Emirate of Nejd]
      winner: Emirate of Nejd
    why: >-
      Cliopatria's Jabal Shammar row for 1842–1845 repeats Nejd's shape; the Rashidis governed Ha'il
      as the second Saudi state's vassals until 1891, so the land is Nejd's. Jabal Shammar's own
      Ha'il is left for review.
    source:
      title: Emirate of Jabal Shammar
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Emirate_of_Jabal_Shammar
  - years: [1873, 1960]
    carry:
      polity: Kuwait
      from: 1820
    why: >-
      Cliopatria ends Kuwait in 1872 and draws its land as Ottoman, Omani and British. The sheikhdom
      went on: a nominal Ottoman vassal from 1871, a British protected state from 1899 until
      independence on 19 June 1961. Its 1820 shape is carried until the State of Kuwait's row.
    source: &kuwait
      title: Sheikhdom of Kuwait
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Sheikhdom_of_Kuwait
  - years: [1900, 1960]
    member:
      polity: Kuwait
      of: (British Empire)
    why: >-
      A British protected state by the Anglo-Kuwaiti Agreement of 23 January 1899, which put its
      foreign affairs in British hands, until 19 June 1961.
    source: *kuwait
  - years: [1873, 1873]
    carry:
      polity: Khanate of Khiva
      from: 1872
    why: >-
      Khiva was an independent khanate until Russian troops took the city on 10 June 1873; on
      1 January 1873 it stood, but Cliopatria's rows end in 1872 and draw its land as Russian.
    source:
      title: Khanate of Khiva
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Khanate_of_Khiva
  - years: [1868, 1868]
    carry:
      polity: Emirate of Bukhara
      from: 1867
    why: >-
      Bukhara was an independent emirate until 1873, and lost Samarkand to Russia only in the war
      of 1868; on 1 January 1868 it held its 1864–1867 shape, but Cliopatria's rows end in 1867
      and draw its land as Russian.
    source: &bukhara
      title: Emirate of Bukhara
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Emirate_of_Bukhara
  - years: [1869, 1873]
    carry:
      polity: Emirate of Bukhara
      from: 1918
    why: >-
      After the war of 1868 Russia annexed much of the emirate, Samarkand among it, and the rest
      stayed independent until it became a Russian protectorate in 1873; its own 1918 shape, the
      emirate without Samarkand, stands for it.
    source: *bukhara
  - years: [1874, 1916]
    give:
      polity: Russian Empire
      to: Khanate of Khiva
      shape_from: {polity: Khanate of Khiva, year: 1918}
      member_of: Russian Empire
    why: >-
      By the peace of 12 August 1873 Khiva became a quasi-independent Russian protectorate until its
      khan abdicated in 1920; Cliopatria draws its land as Russian until 1917, so its own 1918 shape
      returns as a Russian member.
    source:
      title: Khanate of Khiva
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Khanate_of_Khiva
  - years: [1874, 1916]
    give:
      polity: Russian Empire
      to: Emirate of Bukhara
      shape_from: {polity: Emirate of Bukhara, year: 1918}
      member_of: Russian Empire
    why: >-
      After losing Samarkand to Russia in 1868, the rest of the emirate became a Russian protectorate
      in 1873 until the Bolsheviks took it in 1920; Cliopatria draws its land as Russian until 1917,
      so its own 1918 shape returns as a Russian member.
    source: *bukhara
  - years: [1880, 1919]
    member:
      polity: Emirate of Afghanistan
      of: British Raj
    why: >-
      A British protected state from the Treaty of Gandamak (1879), which gave Britain its foreign
      affairs, until the Anglo-Afghan Treaty of 1919.
    source:
      title: Emirate of Afghanistan
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Emirate_of_Afghanistan
  - years: [1911, 1947]
    member:
      polity: Kingdom of Bhutan
      of: British Raj
    why: >-
      By the Treaty of Punakha (8 January 1910) Bhutan agreed to be guided by Britain in its
      external relations, until 1947.
    source:
      title: Treaty of Punakha
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Treaty_of_Punakha
  - years: [1913, 1919]
    carry:
      polity: Mexico
      from: 1912
    why: >-
      Cliopatria has no Mexico from 1913 to 1919, but the state went on through the revolution under
      Huerta (1913–1914) and Carranza, president under the 1917 constitution until 1920.
    source:
      title: Mexican Revolution
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Mexican_Revolution
  # Names out of date in 1914, renamed over the years they are wrong.
  - years: [1862, 1929]
    rename:
      polity: Argentine Confederation
      to: Argentine Republic
    why: >-
      The Argentine Confederation lasted from 1831 to 1861; after Pavón (September 1861) Buenos
      Aires rejoined and the unified country became the Argentine Republic, the name of Cliopatria's
      rows from 1930.
    source:
      title: Argentine Confederation
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Argentine_Confederation
  - years: [1821, 1849]
    rename:
      polity: Empire of Haiti
      to: Republic of Haiti
    why: >-
      Haiti was a republic from 1820 until Faustin I was proclaimed emperor in August 1849.
    source: &haiti
      title: Second Empire of Haiti
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Second_Empire_of_Haiti
  - years: [1860, 1915]
    rename:
      polity: Empire of Haiti
      to: Republic of Haiti
    why: >-
      Faustin I abdicated on 15 January 1859 and a republic was proclaimed; Cliopatria names its
      rows Empire of Haiti until 1915.
    source: *haiti
  - years: [1801, 1922]
    rename:
      polity: Kingdom of Great Britain
      to: United Kingdom of Great Britain and Ireland
    why: >-
      The Acts of Union made Great Britain and Ireland one kingdom on 1 January 1801, until the Irish
      Free State left in 1922.
    source:
      title: United Kingdom of Great Britain and Ireland
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/United_Kingdom_of_Great_Britain_and_Ireland
  - years: [1815, 1940]
    rename:
      polity: Denmark-Norway
      to: Kingdom of Denmark
    why: >-
      By the Treaty of Kiel (14 January 1814) Denmark ceded Norway to Sweden, keeping Greenland,
      Iceland and the Faroes; Cliopatria's Denmark-Norway rows are Denmark from 1815.
    source:
      title: Treaty of Kiel
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Treaty_of_Kiel
  - years: [1815, 1939]
    rename:
      polity: Kingdom of Monaco
      to: Principality of Monaco
    why: >-
      Monaco has been a principality under the Grimaldis since Honoré II took the title of prince in
      1612; it was never a kingdom.
    source: &monaco
      title: Monaco
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Monaco
  - years: [1816, 1860]
    member:
      polity: Principality of Monaco
      of: Kingdom of Sardinia
    why: >-
      The Congress of Vienna made Monaco a protectorate of the Kingdom of Sardinia in 1815, until
      Sardinian forces left in 1860.
    source: *monaco
  - years: [1815, 1879]
    rename:
      polity: Serbs
      to: Principality of Serbia
    why: >-
      The Principality of Serbia emerged in 1815 and was recognised as autonomous in 1830; Cliopatria
      names its rows Serbs.
    source:
      title: Principality of Serbia
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Principality_of_Serbia
  - years: [1885, 1915]
    rename:
      polity: Serbs
      to: Kingdom of Serbia
    why: >-
      Serbia was a kingdom from 6 March 1882 until 1918, as Cliopatria's own rows for 1880–1884 name
      it.
    source:
      title: Kingdom of Serbia
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Kingdom_of_Serbia
  - years: [1863, 1881]
    rename:
      polity: United Principalities of Moldavia and Wallachia
      to: Principality of Romania
    why: >-
      The two principalities were formally united as the Principality of Romania in January 1862.
    source: &romania
      title: Kingdom of Romania
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Kingdom_of_Romania
  - years: [1882, 1916]
    rename:
      polity: United Principalities of Moldavia and Wallachia
      to: Kingdom of Romania
    why: >-
      Romania became a kingdom on 15 March 1881, the name of Cliopatria's rows from 1919.
    source: *romania
  - years: [1909, 1944]
    rename:
      polity: Principality of Bulgaria
      to: Kingdom of Bulgaria
    why: >-
      Bulgaria was raised from a principality to a tsardom on 5 October 1908, until the monarchy
      was abolished in 1946.
    source:
      title: Kingdom of Bulgaria
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Kingdom_of_Bulgaria
  - years: [1833, 1924]
    rename:
      polity: First Hellenic Republic
      to: Kingdom of Greece
    why: >-
      The Treaty of Constantinople (1832) made Greece a monarchy, and King Otto arrived in 1833; the
      Second Hellenic Republic followed in 1924.
