# Corrections to Cliopatria for the borders, each in the file of the era it starts in, here from
# 1800 to 1913 (streaming.md 3.3). A step shows the state of 1 January of its year, so a correction
# covers the years whose 1 January falls in its dates.
modified: 2026-09-29
corrections:
  # The Dutch East Indies and the British interregnum.
  - years: [1800, 1802]
    overlap:
      polities: [Batavian Republic, Dutch East Indies]
      winner: Dutch East Indies
    why: >-
      Smaller wins, checked: the Batavian Republic's row repeats the Indies it took over when the
      Dutch East India Company was dissolved in 1800, and the Indies' own row keeps them.
    source:
      title: Dutch East Indies
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Dutch_East_Indies
  - years: [1812, 1816]
    give:
      polity: Dutch East Indies
      to: British Colonial Empire
    why: >-
      The British took Java in 1811 (the Dutch surrendered on 18 September), Raffles governing it as
      lieutenant-governor, and returned Java and the other East Indian possessions to the Dutch in
      1816. Cliopatria's British rows end in 1813, and in 1812-1813 its smaller Dutch row outdraws
      them.
    source:
      title: Invasion of Java (1811)
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Invasion_of_Java_(1811)
  - years: [1807, 1811]
    member:
      polity: Sultan of Yogyakarta
      of: Dutch East Indies
    why: >-
      A dependent by treaty: Yogyakarta, made by the VOC's Treaty of Giyanti (1755), was a
      protectorate of the Dutch from 1806 to 1811 and again from 1816.
    source:
      title: Yogyakarta Sultanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Yogyakarta_Sultanate
  - years: [1807, 1811]
    member:
      polity: Surakarta Sunanate
      of: Dutch East Indies
    why: >-
      A dependent by treaty: Surakarta, made by the VOC's Treaty of Giyanti (1755), was a
      protectorate of the Dutch from 1806 to 1811 and again from 1816.
    source:
      title: Surakarta Sunanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Surakarta_Sunanate
  - years: [1812, 1816]
    member:
      polity: Sultan of Yogyakarta
      of: British Colonial Empire
    why: A protectorate of the British East India Company from 1811 to 1816.
    source:
      title: Yogyakarta Sultanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Yogyakarta_Sultanate
  - years: [1812, 1816]
    member:
      polity: Surakarta Sunanate
      of: British Colonial Empire
    why: A protectorate of the British East India Company from 1811 to 1816.
    source:
      title: Surakarta Sunanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Surakarta_Sunanate
  - years: [1817, 1827]
    member:
      polity: Sultan of Yogyakarta
      of: Dutch East Indies
    why: >-
      A protectorate of the Netherlands within the Dutch East Indies from 1816 to 1942; Cliopatria's
      Yogyakarta rows end in 1827.
    source:
      title: Yogyakarta Sultanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Yogyakarta_Sultanate
  - years: [1817, 1827]
    member:
      polity: Surakarta Sunanate
      of: Dutch East Indies
    why: >-
      A protectorate of the Netherlands within the Dutch East Indies from 1816 to 1942; Cliopatria's
      Surakarta rows end in 1827.
    source:
      title: Surakarta Sunanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Surakarta_Sunanate
  # Sumbawa's six states in 1815 (owner decision 37), their shapes traced from Chambert-Loir's map
  # as each shape file records.
  - years: [1815, 1815]
    add:
      polity: Kingdom of Tambora
      shape: sumbawa-1815-tambora.geojson
      wikidata: Q20426555
    why: >-
      One of Sumbawa's six states in 1815, on the north-west of the Sanggar peninsula round the
      volcano; the eruption left its land empty until it was annexed to Sanggar in 1866. Shape from
      Chambert-Loir's map in de Jong Boers (1995).
    source:
      title: "Held's History of Sumbawa: An Annotated Translation (Hans Hägerdal), ch. 5, In the Wake of the Tambora Disaster"
      publisher: Amsterdam University Press, 2017 (Cambridge Core)
      url: https://www.cambridge.org/core/product/identifier/9789048531271%23C5/type/BOOK_PART
      locator: p. 141
  - years: [1815, 1815]
    add:
      polity: Kingdom of Pekat
      shape: sumbawa-1815-pekat.geojson
      wikidata: Q20426554
    why: >-
      One of Sumbawa's six states in 1815, on the south of the Sanggar peninsula; after the eruption
      its land was annexed to Dompu in 1866. Shape from Chambert-Loir's map in de Jong Boers (1995).
    source:
      title: "Held's History of Sumbawa: An Annotated Translation (Hans Hägerdal), ch. 5, In the Wake of the Tambora Disaster"
      publisher: Amsterdam University Press, 2017 (Cambridge Core)
      url: https://www.cambridge.org/core/product/identifier/9789048531271%23C5/type/BOOK_PART
      locator: p. 141
  - years: [1815, 1816]
    add:
      polity: Kingdom of Sanggar
      shape: sumbawa-1815-sanggar.geojson
      wikidata: Q20427303
    why: >-
      One of Sumbawa's six states in 1815, on the north-east of the Sanggar peninsula; it outlived
      the eruption as a petty kingdom until it was annexed to Bima in 1928. Shape from
      Chambert-Loir's map in de Jong Boers (1995).
    source:
      title: "Held's History of Sumbawa: An Annotated Translation (Hans Hägerdal), ch. 5, In the Wake of the Tambora Disaster"
      publisher: Amsterdam University Press, 2017 (Cambridge Core)
      url: https://www.cambridge.org/core/product/identifier/9789048531271%23C5/type/BOOK_PART
      locator: p. 141
  - years: [1815, 1816]
    add:
      polity: Sultanate of Dompu
      shape: sumbawa-1815-dompu.geojson
    why: >-
      One of Sumbawa's six states, between Bima and the Sanggar peninsula, bound to the VOC by
      contract since 1669. Shape from Chambert-Loir's map in de Jong Boers (1995).
    source:
      title: "Held's History of Sumbawa: An Annotated Translation (Hans Hägerdal), ch. 3, The Sumbawan Kingdoms under VOC Suzerainty (1)"
      publisher: Amsterdam University Press, 2017 (Cambridge Core)
      url: https://www.cambridge.org/core/product/identifier/9789048531271%23C3/type/BOOK_PART
      locator: p. 77
  - years: [1815, 1816]
    add:
      polity: Sultanate of Sumbawa
      shape: sumbawa-1815-sumbawa.geojson
      wikidata: Q20427322
    why: >-
      The western half of the island, bordering Dompu on the isthmus south of Saleh Bay. Shape from
      Chambert-Loir's map in de Jong Boers (1995).
    source:
      title: "Held's History of Sumbawa: An Annotated Translation (Hans Hägerdal), ch. 4, The Sumbawan Kingdoms under VOC Suzerainty (2)"
      publisher: Amsterdam University Press, 2017 (Cambridge Core)
      url: https://www.cambridge.org/core/product/identifier/9789048531271%23C4/type/BOOK_PART
      locator: p. 115
  - years: [1815, 1816]
    add:
      polity: Sultanate of Bima
      shape: sumbawa-1815-bima.geojson
    why: >-
      Bima's land on Sumbawa east of Dompu, joined to Cliopatria's Bima row, which holds its lands
      across the strait. Shape from Chambert-Loir's map in de Jong Boers (1995).
    source:
      title: "Held's History of Sumbawa: An Annotated Translation (Hans Hägerdal), ch. 3, The Sumbawan Kingdoms under VOC Suzerainty (1)"
      publisher: Amsterdam University Press, 2017 (Cambridge Core)
      url: https://www.cambridge.org/core/product/identifier/9789048531271%23C3/type/BOOK_PART
      locator: p. 77
  - years: [1815, 1815]
    member:
      polity: Kingdom of Tambora
      of: British Colonial Empire
    why: &sumbawa-members >-
      The Sumbawan states, bound by contract to the Dutch, were under the British with the rest of
      the Dutch posts in 1815-1816: Bima had a Resident, and Raffles's government sent Lieutenant
      Owen Phillips to inspect the eruption's damage and help the islanders. The rulers renewed
      their contracts with the Dutch governor at Makassar in 1817.
    source: &dejongboers
      title: "Mount Tambora in 1815: A Volcanic Eruption in Indonesia and its Aftermath (Bernice de Jong Boers)"
      publisher: Indonesia 60 (1995), Cornell University Southeast Asia Program
      url: https://ecommons.cornell.edu/entities/publication/e0fab329-c363-471f-8923-6aba7eccf14b
      locator: pp. 41, 46
  - years: [1815, 1815]
    member:
      polity: Kingdom of Pekat
      of: British Colonial Empire
    why: *sumbawa-members
    source: *dejongboers
  - years: [1815, 1816]
    member:
      polity: Kingdom of Sanggar
      of: British Colonial Empire
    why: *sumbawa-members
    source: *dejongboers
  - years: [1815, 1816]
    member:
      polity: Sultanate of Dompu
      of: British Colonial Empire
    why: *sumbawa-members
    source: *dejongboers
  - years: [1815, 1816]
    member:
      polity: Sultanate of Sumbawa
      of: British Colonial Empire
    why: *sumbawa-members
    source: *dejongboers
  - years: [1815, 1816]
    member:
      polity: Sultanate of Bima
      of: British Colonial Empire
    why: *sumbawa-members
    source: *dejongboers
  # India: Mysore, Hyderabad and the Mughal emperor.
  - years: [1800, 1947]
    add:
      polity: Kingdom of Mysore
      shape: mysore-1799.geojson
    why: >-
      Cliopatria's Mysore ends with Tipu's kingdom in 1799. The Wodeyars' reduced state is drawn
      from 1800 in its shape on the Imperial Gazetteer's 1909 map (native states coloured yellow),
      traced and georeferenced on the plate's graticule; its bounds match the Gazetteer's own
      figures to 0.03°.
    source:
      title: Madras (Southern Section) with Mysore, Coorg & Travancore, Imperial Gazetteer of India (J. G. Bartholomew, 1909)
      publisher: Wikimedia Commons
      url: https://commons.wikimedia.org/wiki/File:Madras_Prov_South_1909.jpg
  - years: [1800, 1858]
    member:
      polity: Kingdom of Mysore
      of: British Empire
    why: >-
      A princely state by treaty: after Tipu's death in 1799 the restored Wodeyars ruled under a
      subsidiary alliance with a British Resident, until Mysore joined India in August 1947.
    source:
      title: Kingdom of Mysore
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Kingdom_of_Mysore
  - years: [1859, 1947]
    member:
      polity: Kingdom of Mysore
      of: British Raj
    why: >-
      A princely state under British paramountcy, directly administered from 1831 to 1881, until
      Mysore joined India on 9 August 1947.
    source:
      title: Kingdom of Mysore
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Kingdom_of_Mysore
  - years: [1801, 1946]
    add:
      polity: Hyderabad State
      shape: hyderabad-1800.geojson
    why: >-
      In 1800 the Nizam ceded to the Company the districts he had gained from Mysore, to pay for its
      subsidiary force; the dominions left to him are Cliopatria's own Hyderabad of 1947, which it
      otherwise draws as British. Berar, the Nizam's from 1803 until assigned in 1853, is left for
      review.
    source:
      title: Ceded Districts
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Ceded_Districts
  - years: [1801, 1858]
    member:
      polity: Hyderabad State
      of: British Empire
    why: >-
      A dependent by treaty: the 1798 agreement put Hyderabad under British protection, and the
      Nizam remained a subsidiary ally under British paramountcy.
    source:
      title: Hyderabad State
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Hyderabad_State
  - years: [1859, 1947]
    member:
      polity: Hyderabad State
      of: British Raj
    why: >-
      A princely state under British paramountcy, with a 23-gun salute, until Indian independence;
      Cliopatria's own Hyderabad row begins in 1947.
    source:
      title: Hyderabad State
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Hyderabad_State
  - years: [1804, 1857]
    member:
      polity: Mughal Empire
      of: British Empire
    why: >-
      On 14 September 1803 British troops entered Delhi and took Shah Alam II under their
      protection; he and his successors ruled only Delhi as the Company's pensioners until the
      revolt of 1857.
    source:
      title: Shah Alam II
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Shah_Alam_II
