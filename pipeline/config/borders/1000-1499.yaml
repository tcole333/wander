# Corrections to Cliopatria for the borders, each in the file of the era it starts in, here from
# 1000 to 1499 (streaming.md 3.3). A step shows the state of 1 January of its year, so a correction
# covers the years whose 1 January falls in its dates.
modified: 2026-10-01
corrections:
  - years: [1028, 1028]
    overlap:
      polities: [North Sea Empire, Old Kingdom of Norway]
      winner: Old Kingdom of Norway
    why: >-
      Smaller wins, checked: on 1 January 1028 Olaf II still ruled Norway; Cnut sailed to subdue it
      later that year.
    source:
      title: North Sea Empire
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/North_Sea_Empire
  - years: [1029, 1035]
    overlap:
      polities: [North Sea Empire, Old Kingdom of Norway]
      winner: North Sea Empire
    why: >-
      From 1028 Cnut held Norway through his son Svein and Ælfgifu, who fled the country in autumn
      1035, so Norway is part of the North Sea Empire in these years.
    source:
      title: North Sea Empire
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/North_Sea_Empire
  - years: [1036, 1039]
    overlap:
      polities: [North Sea Empire, Old Kingdom of Norway]
      winner: Old Kingdom of Norway
    why: >-
      Smaller wins, checked: Magnus the Good ruled Norway after Svein and Ælfgifu fled in 1035.
    source:
      title: North Sea Empire
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/North_Sea_Empire
  - years: [1034, 1055]
    overlap:
      polities: [Kingdom of Arles, Kingdom of France]
      winner: Kingdom of France
    why: >-
      The land Cliopatria gives both is the Duchy of Burgundy round Dijon, granted in 1032 to Robert
      I, whose heirs owed allegiance only to the French crown; the Kingdom of Arles lay east of the
      Saône, in the Empire. Its misplaced rows are left for review.
    source:
      title: Duchy of Burgundy
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Duchy_of_Burgundy
  - years: [1040, 1045]
    overlap:
      polities: [County of Blôis, County of Champagne]
      winner: County of Champagne
    why: >-
      Smaller wins, checked: Cliopatria's Blois row repeats Champagne's shape, but the house of
      Blois held Blois and Champagne (Troyes and Meaux) under different counts.
    source:
      title: County of Champagne
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/County_of_Champagne
  - years: [1094, 1110]
    overlap:
      polities: [County of Blôis, County of Champagne]
      winner: County of Champagne
    why: >-
      Smaller wins, checked: Theobald III divided his lands among his sons, and Hugh held Troyes, the
      core of Champagne, while Stephen-Henry held Blois.
    source:
      title: County of Champagne
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/County_of_Champagne
  - years: [1072, 1271]
    overlap:
      polities: [Norse Greenland, Viking settlements]
      winner: Norse Greenland
    why: >-
      Smaller wins, checked: both rows are Greenland's Norse Eastern and Western Settlements, and
      Norse Greenland is the fitted one.
    source:
      title: Norse colonization of North America
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Norse_colonization_of_North_America
  - years: [1236, 1249]
    overlap:
      polities: [Ceylon, Kingdom of Polonnaruwa]
      winner: Ceylon
    why: >-
      Smaller wins, checked: from 1220 the Sinhalese kings ruled from Dambadeniya, Vijayabahu III
      having faced the invader Kalinga Magha, so the land Cliopatria's Polonnaruwa row shares with
      its Ceylon row, which holds the Dambadeniya row, is not the old kingdom's. Who held Polonnaruwa
      itself in these years is left for review.
    source:
      title: Kingdom of Dambadeniya
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Kingdom_of_Dambadeniya
  - years: [1375, 1394]
    overlap:
      polities: [Giudicato of Arborea, Republic of Pisa]
      winner: Giudicato of Arborea
    why: >-
      Smaller wins, checked: Pisa lost Sardinia to Aragon in 1323–1326, and Arborea under Mariano IV
      and Eleanor held all the island but Cagliari, Alghero and Sassari.
    source:
      title: Judicate of Arborea
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Judicate_of_Arborea
  - years: [1450, 1914]
    pocket:
      at: [54.02, 45.27]
      stateless: false
    why: >-
      The Dead Kultuk, a shallow bay at the Caspian's northeast corner that dries to a salt flat as
      the sea falls, is land in Natural Earth and sea in Cliopatria's shapes, so no state's row
      reaches it and it would stand stateless inside the state holding its shores, ringed by a
      border. It goes to the polities around it in the years they enclose it.
    source:
      title: Dead Kultuk
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Dead_Kultuk
  # Holes between states: a gap in Cliopatria's shapes drawn as the land of the state that held
  # it, each cited (owner decision 38).
  - years: [1094, 1168]
    pocket:
      at: [18.44, 43.99]
      to: Banate of Bosnia
    why: >-
      Bosnia proper (Vrhbosna, Usora, Soli) was a land with its own dukes: under Duklja, whose king
      Constantine Bodin set his cousin Stephen over it, and under Hungary once Béla II took the
      title King of Rama in 1135 and made his son Ladislaus Duke of Bosnia, and under Ban Borić from
      about 1154. Cliopatria ends Duklja's shape here in 1093 and begins its Banate of Bosnia, the
      name drawn here, in 1188. The years around 1101-1135 are thinly documented.
    source:
      title: Bosnia (early medieval polity)
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Bosnia_(early_medieval_polity)
  - years: [1126, 1138]
    pocket:
      at: [96.1, 42.24]
      to: Qocho Kingdom
    why: >-
      The Hami oasis (Yizhou) and the desert east of it toward the Beishan: Qocho seized Yizhou in
      876 and held it after the Guiyi occupation ended in 911, as a Qara Khitai vassal from 1128.
      Cliopatria draws it Kara-Khitan from 1139.
    source:
      title: Qocho
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Qocho
  - years: [1210, 1215]
    pocket:
      at: [78.99, 26.22]
      to: Mamluk Dynasty
    why: >-
      The Chambal and Yamuna country from Bhind to Etawah: after Chandawar (1194) the Ghurids set up
      military stations across the region, and on 1 January 1210 Aibak, who died that November, held
      it for the Mamluk line of Delhi. Cliopatria draws it Ghurid to 1209 and the Delhi Sultanate's
      from 1216.
    source:
      title: Qutb ud-Din Aibak
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Qutb_ud-Din_Aibak
  - years: [1236, 1240]
