    why: >-
      Eastern Amdo (Xiahe, Hezuo, Luqu, Maqu, Zoige) kept its independent polities of hereditary
      rulers after the Tibetan Empire's fall until the Mongols conquered it by 1240; Cliopatria
      draws it Mongol from 1241.
    source:
      title: Amdo
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Amdo
  - years: [1250, 1254]
    pocket:
      at: [21.85, 44.28]
      to: Second Bulgarian Empire
    why: >-
      Braničevo, Kučevo and the Timok were Bulgarian until Béla IV forced Tsar Michael II Asen to
