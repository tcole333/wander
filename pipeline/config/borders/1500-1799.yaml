    source:
      title: Bijapur district, Karnataka
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Bijapur_district,_Karnataka
  - years: [1769, 1777]
    pocket:
      at: [-68.55, -6.97]
      stateless: true
    why: >-
      The interior of western Amazonia south of the Solimões (the Javari, Juruá and Purus basins)
      had no state: Panoan peoples lived in the upper Purus and Juruá, and until the mid-19th
