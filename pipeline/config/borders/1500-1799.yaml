      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Gujarat_under_Ahmad_Shah_Bahadur
  - years: [1748, 1751]
    pocket:
      at: [79.75, 26.25]
      to: Mughal Empire
      shape_from: {polity: Mughal Empire, year: 1741}
      within: {polity: Maratha Empire, year: 1762}
    why: >-
      On 1 January 1748 the lower Doab (Kanpur, Kora, Fatehpur) was still the Mughal emperor's:
