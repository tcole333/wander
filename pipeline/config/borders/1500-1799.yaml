    source:
      title: Petropavl
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Petropavl
  - years: [1744, 1756]
    pocket:
      at: [70.25, 21.25]
      to: Mughal Empire
      shape_from: {polity: Mughal Empire, year: 1741}
      within: {polity: Maratha Empire, year: 1757}
    why: >-
      Western Kathiawar (Jamnagar, Porbandar, Veraval) paid tribute to the Mughal viceroys of
      Gujarat, who in 1751 still collected a contribution from the Jam of Nawanagar; the Marathas
