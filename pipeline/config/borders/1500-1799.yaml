  - years: [1744, 1751]
    pocket:
      at: [69.11, 54.38]
      to: Kazakh Khanate
    why: >-
      The strip from the Tobol to the Irtysh (Petropavlovsk, Mamlyutka) was Middle Zhuz pasture
