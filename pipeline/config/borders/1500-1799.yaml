      at: [41.32, 30.53]
      to: Emirate of Diriyah
      shape_from: {polity: Emirate of Diriyah, year: 1805}
    why: >-
      The Nafud, al-Jawf and the desert toward the Euphrates were the First Saudi State's: taking in
