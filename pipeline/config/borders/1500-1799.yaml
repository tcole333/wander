    source:
      title: First Saudi State
      publisher: Saudipedia
      url: https://saudipedia.com/en/article/651/history/the-first-saudi-state/first-saudi-state
  - years: [1794, 1804]
    pocket:
      at: [40.94, 32.5]
      stateless: true
    why: >-
      The Hamad, the Syrian Desert west of the Euphrates, stayed stateless: its camel tribes did not
