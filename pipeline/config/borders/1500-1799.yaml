# Corrections to Cliopatria for the borders, each in the file of the era it starts in, here from
# 1500 to 1799 (streaming.md 3.3). A step shows the state of 1 January of its year, so a correction
# covers the years whose 1 January falls in its dates.
modified: 2026-10-01
corrections:
  - years: [1572, 1587]
    overlap:
      polities: [Kingdom of Pajana, Sultanate of Malacca]
      winner: Kingdom of Pajana
    why: >-
      Smaller wins, checked: the land they share is central Java, Pajang's (1568–1586). Malacca fell
      to the Portuguese in 1511 and never ruled Java; its row's Javanese part is left for review.
    source:
      title: Pajang Sultanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Pajang_Sultanate
  - years: [1588, 1639]
    overlap:
      polities: [Mataram Sultanate, Sultanate of Malacca]
      winner: Mataram Sultanate
    why: >-
      The land they share is central Java, where Mataram rose in 1586 in Pajang's place and which
      Sultan Agung held with the rest of central and eastern Java; Malacca had fallen to the
      Portuguese in 1511.
    source:
      title: Mataram Sultanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Mataram_Sultanate
  - years: [1702, 1717]
    overlap:
      polities: [Brandenburg-Prussia, Kingdom of Prussia]
      winner: Kingdom of Prussia
    why: >-
      Both rows are the Hohenzollern state; from Frederick I's coronation on 18 January 1701 its
      lands were known as the Kingdom of Prussia, so that row keeps them.
    source:
      title: Kingdom of Prussia
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Kingdom_of_Prussia
  - years: [1708, 1712]
    give:
      polity: English Colonial Empire
      to: British Colonial Empire
    why: >-
      The Acts of Union took effect on 1 May 1707, uniting England and Scotland as Great Britain, so
      from 1708 England's colonies are British; Cliopatria keeps an English row to 1712.
    source:
      title: Acts of Union 1707
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Acts_of_Union_1707
  - years: [1757, 1768]
    overlap:
      polities: [Corsican Republic, Republic of Genoa]
      winner: Corsican Republic
    why: >-
      Smaller wins, checked: Paoli's Corsican Republic (1755–1769) held the island against Genoa,
      which ceded its claims to France in 1768.
    source:
      title: Corsican Republic
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Corsican_Republic
  - years: [1793, 1802]
    member:
      polity: Carnatic Sultanate
      of: British Empire
    why: >-
      A dependent by treaty: by the treaties of 1763, 1781, 1785, 1787 and 1792 the English came to
      manage the Carnatic for the Nawab, to settle his debts, and after 1799 they assumed its
      government. Drawn from 1793, once the last of those treaties had taken effect, and through
      1802, the last year of Cliopatria's row.
    source:
      title: Dictionary of Indian Biography, 'Carnatic, Muhammad Ali Khan Walajah, Nawab of the'
      publisher: Wikisource (C. E. Buckland, 1906)
      url: https://en.wikisource.org/wiki/Dictionary_of_Indian_Biography/Carnatic,_Muhammad_Ali_Khan_Walajah,_Nawab_of_the
  - years: [1799, 1800]
    carry:
      polity: Hyderabad State
      from: 1798
    why: >-
      Cliopatria ends Hyderabad in 1798, but the Nizam kept his state as the Company's first
      subsidiary ally; its 1798 shape holds until the Ceded Districts pass to the Company in 1800.
    source:
      title: Hyderabad State
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Hyderabad_State
  - years: [1799, 1800]
    member:
      polity: Hyderabad State
      of: British Empire
    why: >-
      A dependent by treaty: in 1798 the Nizam signed an agreement that put Hyderabad under British
      protection, the first Indian prince to do so.
    source:
      title: Hyderabad State
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Hyderabad_State
  - years: [1776, 1802]
    member:
      polity: Nawab of Awadh
      of: British Empire
    why: >-
      A subsidiary ally by treaty: Asaf-ud-Daula acceded with British aid in exchange for the Treaty
      of Benares (1775), which raised what Awadh paid for Company troops and ceded Benares; the
      treaty of 21 February 1798 raised the subsidy again, and in 1801 Saadat Ali Khan II ceded half
      his state. Cliopatria's Awadh ends in 1802; its later, smaller shape is left for review.
    source:
      title: Oudh State
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Awadh_State
  # Holes between states: a gap in Cliopatria's shapes drawn as the land of the state that held
  # it, or a place without a state kept stateless, each cited (owner decision 38).
  - years: [1662, 1669]
    pocket:
      at: [37.98, 50.28]
      to: Tsardom of Russia
    why: >-
      Sloboda Ukraine, south of Muscovy's Belgorod line (Sumy, Okhtyrka, Kharkiv, Ostrogozhsk), was
      settled by Cossack regiments under the sovereignty of the Russian tsars, founded at
      Ostrogozhsk in 1652, Sumy and Okhtyrka in 1658 and Kharkiv in 1659. Cliopatria's Sloboda
      Ukraine begins in 1670.
    source:
      title: Sloboda Ukraine
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Sloboda_Ukraine
  - years: [1677, 1682]
    pocket:
      at: [-74.65, 41.7]
      stateless: true
    why: >-
      The upper Delaware and the Catskill and Shawangunk country (Port Jervis, Monticello, Goshen)
      was the Munsee's homeland, whose first European settlers came from the Hudson valley only in
      the late seventeenth and early eighteenth centuries; England's charters claimed it, but no
      colony had yet settled or governed it.
    source:
      title: Minisink
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Minisink
  - years: [1757, 1757]
    pocket:
      at: [76.44, 17.85]
      to: Hyderabad State
    why: >-
      The western Deccan (Aurangabad, Bidar, Naldurg, Solapur, Gulbarga) was the Nizam's in 1757:
      Salabat Jung's defeats at Sindkhed later in 1757 and at Udgir in 1760 came after, and
      Aurangabad, Daulatabad and Solapur were ceded to the Marathas only after Kharda in 1795.
      Cliopatria's Hyderabad of 1757-1761 leaves it out.
    source:
      title: Nizam Ali Khan, Asaf Jah II
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Nizam_Ali_Khan,_Asaf_Jah_II
  - years: [1769, 1775]
    pocket:
      at: [78.12, 12.57]
      to: Kingdom of Mysore
    why: >-
      The Baramahal (Krishnagiri, Dharmapuri) was Hyder Ali's and Tipu's Mysore until the Treaty of
      Seringapatam gave it to the Company in 1792; Cliopatria's Mysore leaves it out.
    source:
      title: Treaty of Seringapatam
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Treaty_of_Seringapatam
  - years: [1791, 1793]
    pocket:
      at: [79.98, 27.99]
      to: Nawab of Awadh
    why: >-
      Shahjahanpur, Budaun, Etah and Mainpuri were Awadh's until Saadat Ali Khan ceded Rohilkhand
      and the lower Doab to the Company in 1801. Cliopatria's Awadh leaves them out in 1791-1793 and
      takes them in from 1794.
    source:
      title: Ceded and Conquered Provinces
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Ceded_and_Conquered_Provinces
  # The holes and gaps the bake owed, each settled by a verdict checked against its source
  # (owner decision 38): a gap's land as the state that held it, drawn inside the shapes of
  # the polities that held it on both sides of the run where those bound it.
  - years: [1502, 1506]
    pocket:
      at: [36.75, 53.75]
      to: Grand Principality of Moscow
      shape_from: {polity: Golden Horde, year: 1497}
      within: {polity: Grand Principality of Moscow, year: 1507}
    why: >-
      The Tula land and the upper Oka principalities (Odoyev, Belyov, Novosil) were Moscow's: the
      treaty of 1494 made Lithuania recognise the upper Oka princes as Moscow's, Kashira and Aleksin
      had long been Muscovite, and Tula was Muscovite by 1503 at the latest.
    source:
      title: Upper Oka Principalities
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Upper_Oka_Principalities
  - years: [1519, 1525]
    pocket:
      at: [80.25, 26.25]
      to: Lodi Dynasty
      shape_from: {polity: Lodi Dynasty, year: 1516}
      within: {polity: Mughal Empire, year: 1529}
    why: >-
      Central and eastern Uttar Pradesh (Kanauj, Kalpi, Lucknow, Jaunpur, Varanasi) was the Lodis',
      whose rule under Sikandar reached from the Punjab to Saran and Champaran.
    source:
      title: Unit 5, Early Mughals and Afghans
      publisher: IGNOU (eGyanKosh)
      url: https://egyankosh.ac.in/bitstream/123456789/68909/3/Unit-5.pdf
  - years: [1529, 1533]
    pocket:
      at: [84.25, 26.25]
      to: Sultanate of Bengal
      shape_from: {polity: Lodi Dynasty, year: 1516}
      within: {polity: Sur Empire, year: 1540}
    why: >-
      On 1 January 1529 the borderland west of the Gandak (Deoria, Siwan, Gopalganj) was Bengal's:
      Nasrat Shah annexed the land up to the Tons soon after 1522, and Babur beat Bengal's army on
      the Ghaghra only in May 1529.
    source:
      title: Nasiruddin Nasrat Shah
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Nasiruddin_Nasrat_Shah
  - years: [1552, 1555]
    pocket:
      at: [76.75, 23.75]
      to: Sur Empire
      shape_from: {polity: Sur Empire, year: 1547}
      within: {polity: Mughal Empire, year: 1564}
    why: >-
      North-eastern Malwa (Sarangpur, Bhopal, Raisen, Vidisha) was governed for the Sur Empire by
      Shuja'at Khan, whose son Baz Bahadur succeeded him as Sultan of Malwa in 1555.
    source:
      title: Baz Bahadur
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Baz_Bahadur
  - years: [1564, 1578]
    pocket:
      at: [71.75, 28.25]
      to: Mughal Empire
      shape_from: {polity: Sur Empire, year: 1552}
      within: {polity: Mughal Empire, year: 1579}
    why: >-
      South-western Punjab (Multan, Uch, Bahawalpur, Pakpattan) was Mughal from 1557, when Bairam
      Khan's army took Multan; Akbar made it a subah in 1580.
    source:
      title: Multan
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Multan
  - years: [1640, 1652]
    pocket:
      at: [-4.75, 56.75]
      to: Kingdom of Scotland
      shape_from: {polity: Kingdom of England, year: 1636}
      within: {polity: Commonwealth of England, year: 1653}
    why: >-
      Mainland Scotland and the central Highlands were the Kingdom of Scotland's under its
      Covenanter governments from 1638, which proclaimed Charles II in 1649, until the English
      victories at Dunbar (1650) and Worcester (September 1651) and the Tender of Union, proclaimed
      in Scotland in February 1652. Cliopatria folds Scotland into England in 1609-1639 and then
      leaves it empty.
    source:
      title: Scotland under the Commonwealth
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Scotland_under_the_Commonwealth
  - years: [1653, 1661]
    pocket:
      at: [30.75, 48.25]
      to: Zaporozhian Cossacks
      shape_from: {polity: Polish-Lithuanian Commonwealth, year: 1648}
      within: {polity: Zaporozhian Cossacks, year: 1662}
    why: >-
      The right-bank steppe south of Chyhyryn was the Cossack Hetmanate's, recognised at Zboriv in
      1649 and self-governing under the tsar after Pereiaslav (1654); Cliopatria's Zaporozhian
      Cossacks row, its row for the Hetmanate, takes it from 1662.
    source:
      title: Cossack Hetmanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Cossack_Hetmanate
  - years: [1653, 1661]
    pocket:
      at: [32.75, 49.75]
      to: Zaporozhian Cossacks
      shape_from: {polity: Polish-Lithuanian Commonwealth, year: 1648}
      within: {polity: Tsardom of Russia, year: 1662}
    why: >-
      The left-bank core of the Hetmanate (the Lubny, Myrhorod and Pyriatyn regiments) was the
      hetman's state from 1649, self-governing under the tsar after 1654, until Andrusovo split the
      banks in 1667.
    source:
      title: Cossack Hetmanate
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Cossack_Hetmanate
  - years: [1687, 1690]
    pocket:
      at: [79.75, 16.25]
      to: Golconda Sultanate
      shape_from: {polity: Golconda Sultanate, year: 1683}
      within: {polity: Mughal Empire, year: 1691}
    why: >-
      On 1 January 1687 the Qutb Shahi heartland (Nalgonda, Guntur, the Krishna-Godavari delta) was
      still the Golconda Sultanate's: Aurangzeb besieged Golconda from January and took it in
      September 1687.
    source:
      title: Siege of Golconda
      publisher: Wikipedia
      url: https://en.wikipedia.org/wiki/Siege_of_Golconda
  - years: [1687, 1705]
    pocket:
      at: [92.25, 52.75]
      to: Dzungar Khanate
      shape_from: {polity: Golden Horde, year: 1683}
      within: {polity: Tsardom of Russia, year: 1706}
    why: >-
      The Minusinsk basin and Khakassia, the Yenisei Kyrgyz land, was under the Dzungars: the Kyrgyz
      princes became their vassals, a Dzungar viceroy lived among them, and in 1703 the Dzungars
      removed most of the Kyrgyz to Dzungaria; the Russians built Abakan fort only in 1707.
    source:
      title: Присоединение Хакасии к России
      publisher: Wikipedia (Russian)
      url: https://ru.wikipedia.org/wiki/%D0%9F%D1%80%D0%B8%D1%81%D0%BE%D0%B5%D0%B4%D0%B8%D0%BD%D0%B5%D0%BD%D0%B8%D0%B5_%D0%A5%D0%B0%D0%BA%D0%B0%D1%81%D0%B8%D0%B8_%D0%BA_%D0%A0%D0%BE%D1%81%D1%81%D0%B8%D0%B8
  - years: [1721, 1756]
    pocket:
      at: [86.96, 50.75]
