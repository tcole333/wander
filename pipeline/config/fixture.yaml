# The fixture profile (streaming.md 7.3): 55 tiles, and the committed GEBCO excerpt each group
# reads per level in place of 3.1's sources. Only the sources differ; the real encoder runs.
# Sumbawa is an L2-L7 chain on one face. The Kirkuk corner, where faces 0, 1 and 4 meet, is the
# cross-face test site, with a mid pyramid (owner decision 15). `uv run prebuild excerpts` cuts each
# excerpt to the union of the windows of the tiles that read it.

# Excerpt name: cell size in arc-seconds. 15" excerpts hold GEBCO cells; the others hold block
# means, rounded to whole meters.
excerpts:
  global-30m: 1800
  sumbawa-4m: 240
  sumbawa-1m: 60
  sumbawa-15s: 15
  kirkuk-4m: 240
  kirkuk-1m: 60
  kirkuk-15s: 15

groups:
  global:
    rasters: {0: global-30m, 1: global-30m}
    tiles: [all-L0, all-L1]
  sumbawa:
    rasters: {2: sumbawa-4m, 3: sumbawa-4m, 4: sumbawa-1m, 5: sumbawa-1m, 6: sumbawa-15s, 7: sumbawa-15s}
    # 7/1/102/50 is the within-face neighbor of 7/1/103/50, which holds the Tambora summit.
    tiles: [2/1/3/1, 3/1/6/3, 4/1/12/6, 5/1/25/12, 6/1/51/25, 7/1/103/50, 7/1/102/50]
  kirkuk:
    rasters: {2: global-30m, 3: kirkuk-4m, 4: kirkuk-4m, 5: kirkuk-1m, 6: kirkuk-1m, 7: kirkuk-15s}
    # The three tiles that share the cube vertex at 45°E 35.26°N, per level.
    tiles: [2/0/3/3, 2/1/0/3, 2/4/3/0, 3/0/7/7, 3/1/0/7, 3/4/7/0, 4/0/15/15, 4/1/0/15, 4/4/15/0,
            5/0/31/31, 5/1/0/31, 5/4/31/0, 6/0/63/63, 6/1/0/63, 6/4/63/0,
            7/0/127/127, 7/1/0/127, 7/4/127/0]
