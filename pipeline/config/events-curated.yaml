# Hand-made corrections to the event index (streaming.md 3.4), each with its reason (`why`).
# `boosts` adds percentile points before class weighting in .wev, capped at 1: {qid, boost, why}.
# Optional `legacyBoost` preserves the TSV's log2(1 + editions) x weight score. `dates` gives the
# days a better source dates an event to where Wikidata's are wrong: {qid, date?, end?, why}, the
# day it dates the event to, the day the event ends, or both, each a quoted ISO day as history
# writes it, in the Julian calendar before 15 October 1582. `contested` names the events whose
# date the sources dispute, which Meanwhile, printing one date for each, leaves out: {qid, why}.
# `places` moves a located event to where a better source puts it: {qid, place: [lon, lat], why,
# source: {title, url}}, which stands in for its own coordinates and its location's; the events
# stage refuses one for an event the export lacks or leaves unlocated. It also supplies unlocated
# parents with a sourced P17 `countryCentroid: [lon, lat]` or a last-resort `at: [lon, lat]`, each
# with qid and why. Children take precedence over both. The current export does not carry P17, so
# no country position is guessed from the event's label.
places:
  - qid: Q191055
    place: [-9.139016, 38.708042]
    why: >-
      The 1755 earthquake is Lisbon's: with the fires and the tsunami that follow it, it almost
      completely destroys the city, as its article recounts. Wikidata's coordinates, 36°N 11°W,
      are the epicentre its article's infobox estimates in the Atlantic, some 200 km west-southwest
      of Cape St. Vincent, a place whose exact position the article calls a subject of
      considerable debate. Its mark stands at Lisbon, its location (P276) in Wikidata, at the
      coordinates the export gives it.
    source:
      title: 1755 Lisbon earthquake (Wikipedia)
      url: "https://en.wikipedia.org/wiki/1755_Lisbon_earthquake"
boosts:
  - qid: Q48314
    boost: 0.029792238337906744
    legacyBoost: 1.5
    why: >-
      Waterloo has 94 Wikipedia editions, more than any other event of 1815, but a battle's
      weight ranks it below the lesser wars of its month, such as the Second Barbary War (24), so
      June 1815 in Meanwhile would lack it. In the 2026-09-28 table's 1800-1850 era (2,551 rows),
      the legacy +1.5 moves it from rank 104 to 28: 76 / 2551 = 0.029792238337906744 percentile
      points. The runtime uses that gain; legacyBoost keeps the table and Meanwhile unchanged.
dates:
  - qid: Q3656338
    date: "1816-09-30"
    why: >-
      The Nejd Expedition begins when Ibrahim Pasha lands at Yanbu, which the 1911 Britannica
      ('Ibrahim Pasha') dates to 30 September 1816; Wikidata's start, 29 September 1817, copies
      an infobox.
  - qid: Q4870957
    date: "1813-10-17"
    why: >-
      The Battle of El Roble, on the Itata, is fought on 17 October 1813, as its article and the
      Academia de Historia Militar de Chile ('Combate de El Roble') give it; Wikidata's 1815 is
      two years late.
  - qid: Q212618
    date: "1960-05-22"
    why: >-
      The Valdivia earthquake's main shock strikes on 22 May 1960 at 19:11 UTC (15:11 local time),
      as its article dates it; Wikidata's 21 May is the day of the Concepción earthquake that began
      its foreshock sequence.
  - qid: Q160077
    end: "1453-05-29"
    why: >-
      Constantinople falls on 29 May 1453, ending the siege begun on 6 April, as Steven Runciman's
      The Fall of Constantinople 1453 (Cambridge, 1965) and its article date them in the Julian
      calendar. Wikidata converts the start to the Gregorian 15 April but exports the end
      unconverted, as a Gregorian 29 May, which is 20 May in the Julian.
contested:
  - qid: Q12241904
    why: >-
      The Al-Jawazi massacre falls on 5 September: 1816 in its own article and Wikidata, 1817 in
      Wikipedia's Yusuf Karamanli and Ottoman Tripolitania articles and in Arabic sources.
  - qid: Q4871304
    why: >-
      The Battle of Jaithak's article dates it 25 September 1815 in its infobox, which Wikidata
      copies, and to the night of 25 December 1814 in its account; Wikipedia's Anglo-Nepalese War
      article puts the attack on 27 December 1814.
