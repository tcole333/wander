# Meanwhile's written lines (docs/design/streaming.md 3.9): for each event a beat's Meanwhile
# shows, the line the panel prints, in the story's voice, and the source it rests on. `date` gives
# the day or month the source dates it to where Wikidata's differs, and `at` [lon, lat] its place where
# Wikidata's is its location's middle (a country, a colony, a sea). The rule picks by both.
# `uv run prebuild meanwhile --story magellan` merges them into story.lock.json.

Q4087402:
  line: At Sokal, Crimean archers drive Polish troops back to the river
  date: "1519-08-02"
  source: {title: Battle of Sokal (Wikipedia), url: "https://en.wikipedia.org/wiki/Battle_of_Sokal"}

