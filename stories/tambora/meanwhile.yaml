# Meanwhile's written lines (docs/design/streaming.md 3.9): for each event a beat's Meanwhile
# shows, the line the panel prints, in the story's voice, and the source it rests on. `date` gives
# the day the source dates it to where Wikidata's differs, and `at` [lon, lat] its place where
# Wikidata's is its location's middle (a country, a colony, a sea). The rule picks by both.
# `uv run prebuild meanwhile --story tambora` merges them into story.lock.json.

Q3538392:
  line: Kandy's chiefs depose their king and cede his kingdom to Britain
  date: "1815-03-02"
  source: {title: Kandyan Convention (Wikipedia), url: "https://en.wikipedia.org/wiki/Kandyan_Convention"}

Q54322416:
  line: In Florida, Creek refugees promise allegiance to the British Crown
  source: {title: Treaty of Nicolls' Outpost (Wikipedia), url: "https://en.wikipedia.org/wiki/Treaty_of_Nicolls%27_Outpost"}

Q25412993:
  line: Bolívar besieges Cartagena, held against him by fellow patriots
  date: "1815-03-26"
  source: {title: Asedio neogranadino de Cartagena de Indias (1815) (Spanish Wikipedia), url: "https://es.wikipedia.org/wiki/Asedio_neogranadino_de_Cartagena_de_Indias_(1815)"}

Q14833923:
  line: At Takovo, Miloš Obrenović raises the Serbs in revolt against the Ottomans
  date: "1815-04-23"
  source: {title: Takovo Meeting (Wikipedia), url: "https://en.wikipedia.org/wiki/Takovo_Meeting"}

Q1359641:
  line: At Tolentino, Austria defeats the army of Murat, Napoleon's King of Naples
  source: {title: Battle of Tolentino (Wikipedia), url: "https://en.wikipedia.org/wiki/Battle_of_Tolentino"}

Q298864:
  line: Murat's war ends, and Naples returns to its Bourbon king
  at: [14.2, 41.18]
  source: {title: Neapolitan War (Wikipedia), url: "https://en.wikipedia.org/wiki/Neapolitan_War"}

Q46362:
  line: At Vienna, diplomats keep redrawing Europe's map despite Napoleon's return
  source: {title: Congress of Vienna (Wikipedia), url: "https://en.wikipedia.org/wiki/Congress_of_Vienna"}

Q48314:
  line: At Waterloo, Wellington and Blücher defeat Napoleon in his last battle
  source: {title: Battle of Waterloo (Wikipedia), url: "https://en.wikipedia.org/wiki/Battle_of_Waterloo"}

Q5010928:
  line: On the Cape frontier, Boer farmers rise against British rule
  date: "1815-11-18"
  at: [25.8, -32.8]
  source: {title: Slachter's Nek Rebellion (Wikipedia), url: "https://en.wikipedia.org/wiki/Slachter%27s_Nek_Rebellion"}

Q233688:
  line: In Paris, France signs a peace that orders it to pay 700 million francs
  source: {title: Treaty of Paris (1815) (Wikipedia), url: "https://en.wikipedia.org/wiki/Treaty_of_Paris_(1815)"}

Q2890016:
  line: At Sipe-Sipe, Spain's royalists rout the army of Buenos Aires
  date: "1815-11-29"
  source: {title: Battle of Viluma (Wikipedia), url: "https://en.wikipedia.org/wiki/Battle_of_Viluma"}

Q1757487:
  line: At Seven Oaks, Métis riders kill Governor Semple and twenty men
  source: {title: Battle of Seven Oaks (Wikipedia), url: "https://en.wikipedia.org/wiki/Battle_of_Seven_Oaks"}

Q2890524:
  line: On a ridge near Popayán, Spain's army ends New Granada's first republic
  source: {title: Battle of Cuchilla del Tambo (Wikipedia), url: "https://en.wikipedia.org/wiki/Battle_of_Cuchilla_del_Tambo"}

Q3248484:
  line: In a house at Tucumán, the United Provinces declare independence from Spain
  source: {title: Argentine Declaration of Independence (Wikipedia), url: "https://en.wikipedia.org/wiki/Argentine_Declaration_of_Independence"}

Q1425658:
  line: After crossing the Andes, San Martín's army routs Spain's at Chacabuco
  source: {title: Battle of Chacabuco (Wikipedia), url: "https://en.wikipedia.org/wiki/Battle_of_Chacabuco"}

Q7837193:
  line: The Peshwa signs away lands to the East India Company at Pune
  date: "1817-06-13"
  source: {title: Treaty of Poona (1817) (Wikipedia), url: "https://en.wikipedia.org/wiki/Treaty_of_Poona_(1817)"}

Q7165306:
  line: Egged on by a government spy, Derbyshire men march on Nottingham with pikes
  source: {title: Pentrich rising (Wikipedia), url: "https://en.wikipedia.org/wiki/Pentrich_rising"}

Q617210:
  line: At Pune, the Peshwa turns on the British and burns their Residency
  date: "1817-11-05"
